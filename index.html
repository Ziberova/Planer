<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plans on 2027</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#3d3550; --muted:#8d85a3; --line:#ece7f6;
    --accent:#b79cf5; --accent2:#f7a8c4;
    --card:rgba(255,255,255,.82);
    --weekend:#ffe4ee; --weekend-ink:#c2567e;
    --radius:18px;
  }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#efe6ff,#ffe6f0 45%,#e6f7f2);
    background-attachment:fixed;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hidden{display:none !important}

  /* ================= LOADER ================= */
  #loader{
    position:fixed;inset:0;z-index:100;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#efe6ff,#ffe6f0 50%,#e6f7f2);
    transition:opacity .6s ease;
  }
  .ld-bg{position:absolute;inset:0;pointer-events:none}
  .ld-item{
    position:absolute;line-height:1;opacity:.92;
    filter:drop-shadow(0 6px 12px rgba(61,53,80,.12));
    animation:float 6s ease-in-out infinite;
    transform:rotate(var(--r,0deg));
  }
  .ld-item:nth-child(3n){animation-delay:-2s}
  .ld-item:nth-child(3n+1){animation-delay:-4s}
  .ld-item:nth-child(4n){animation-delay:-1s}
  @keyframes float{
    0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}
    50%{transform:rotate(var(--r,0deg)) translateY(-14px)}
  }
  .ld-center{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:30px 38px;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:28px;border:1px solid rgba(255,255,255,.7);
    box-shadow:0 24px 60px rgba(61,53,80,.12);
    max-width:calc(100vw - 32px);
  }
  .loader-sub{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
  .loader-title{
    font-size:36px;font-weight:700;letter-spacing:.5px;text-align:center;
    background:linear-gradient(135deg,#8f7ae0,#ef8fb5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .bar-track{
    width:min(280px,66vw);height:10px;border-radius:999px;
    background:#ffffffcc;overflow:hidden;box-shadow:inset 0 1px 3px #0000000d;
    margin-top:6px;
  }
  .bar-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s ease;
  }
  .bar-pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .loader-msg{font-size:13px;color:var(--muted);min-height:18px;text-align:center}
  #startBtn{
    margin-top:6px;padding:11px 32px;border-radius:999px;font-size:14px;font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    box-shadow:0 10px 26px #b79cf555;opacity:0;pointer-events:none;
    transition:opacity .5s,transform .2s;
  }
  #startBtn.show{opacity:1;pointer-events:auto}
  #startBtn:hover{transform:translateY(-2px)}

  @media(max-width:560px){
    .ld-item{display:none}
    .loader-title{font-size:28px}
    .ld-center{padding:24px 24px}
  }

  /* ================= APP ================= */
  #app{max-width:820px;margin:0 auto;padding:22px 14px 50px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .brand{font-size:17px;font-weight:700;letter-spacing:.4px}
  .brand small{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

  .card{
    background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:var(--radius);box-shadow:0 10px 26px #3d35500f;
    padding:18px;
  }

  /* ================= YEAR ================= */
  .year-head{text-align:center;margin-bottom:18px}
  .year-head h1{
    font-size:42px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(135deg,#8f7ae0,#ef8fb5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .year-head p{color:var(--muted);font-size:12.5px;margin-top:4px}
  .year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .mini{
    border-radius:14px;padding:12px;text-align:left;width:100%;
    box-shadow:0 6px 18px #3d35500d;transition:.2s;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .mini:hover{transform:translateY(-3px);box-shadow:0 12px 26px #3d355018}
  .mini h3{display:flex;justify-content:space-between;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;margin-bottom:8px}
  .mini h3 .mn{display:flex;align-items:center;gap:5px}
  .mini h3 em{font-style:normal;font-size:15px;line-height:1}
  .mini h3 .cnt{font-size:9.5px;font-weight:400;color:var(--muted)}
  .mini-dow,.mini-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mini-dow div{font-size:8.5px;text-align:center;color:var(--muted);padding-bottom:3px}
  .mini-dow div.we{color:var(--weekend-ink);font-weight:700}
  .mini-days div{font-size:10px;text-align:center;padding:3px 0;border-radius:5px;color:#5b5372}
  .mini-days div.empty{visibility:hidden}
  .mini-days div.weekend{background:var(--weekend);color:var(--weekend-ink);font-weight:600}
  .mini-days div.mark{background:#f7a8c440;color:#a8486e;font-weight:700}
  .mini-days div.today{background:var(--accent);color:#fff;font-weight:700}

  /* ================= MONTH ================= */
  .month-card{position:relative;overflow:hidden}
  .month-deco{position:absolute;inset:0;pointer-events:none;z-index:0}
  .md{position:absolute;opacity:.16;line-height:1;transform:rotate(var(--r,0deg))}
  .month-card > *:not(.month-deco){position:relative;z-index:1}

  .month-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .month-head h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
  .month-head h2 em{font-style:normal;font-size:22px;line-height:1}
  .nav{display:flex;gap:5px;align-items:center}
  .nav button{
    width:32px;height:32px;border-radius:10px;background:#ffffffcc;
    box-shadow:0 3px 10px #3d35500f;font-size:14px;
    display:grid;place-items:center;transition:.2s;
  }
  .nav button:hover{background:#fff;transform:translateY(-1px)}
  .dow-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .dow-grid div{text-align:center;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .dow-grid div.we{color:var(--weekend-ink)}
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .day{
    position:relative;aspect-ratio:1/1;border-radius:12px;background:#ffffffb0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:12.5px;font-weight:600;color:#4c4463;
    box-shadow:0 2px 8px #3d355008;transition:.18s;
  }
  .day:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 16px #3d355015}
  .day.empty{visibility:hidden}
  .day.weekend{background:var(--weekend);color:var(--weekend-ink)}
  .day.weekend:hover{background:#ffd8e6}
  .day .m{font-size:13px;line-height:1}
  .day .badge{
    position:absolute;top:4px;right:4px;min-width:14px;height:14px;padding:0 3px;
    border-radius:999px;background:var(--accent);color:#fff;font-size:8.5px;
    display:grid;place-items:center;font-weight:700;
  }
  .day.today{outline:2px solid var(--accent2);outline-offset:-2px}

  .section-title{margin:20px 0 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .section-title span{font-size:11px;color:var(--muted);font-weight:400}

  /* ================= READING ================= */
  .read-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:#ffffffb0;border-radius:999px;padding:6px 12px;font-size:11.5px;color:#5b5372;
    box-shadow:0 3px 10px #3d355008}
  .chip b{color:var(--ink)}
  .book{background:#ffffffc4;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 4px 12px #3d35500a}
  .book-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .book-title{font-size:13px;font-weight:600}
  .book-author{font-size:11px;color:var(--muted);margin-top:2px}
  .book .del{color:#c9a3b4;font-size:13px;padding:2px 6px;border-radius:8px}
  .book .del:hover{background:#fdeef4;color:#c2567e}
  .book-mid{display:flex;align-items:center;gap:10px;margin-top:9px}
  .pbar{flex:1;height:7px;border-radius:999px;background:#f0ecf8;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .book-nums{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  .book-nums input{
    width:46px;padding:3px 5px;border:1px solid var(--line);border-radius:7px;
    font-size:11px;text-align:center;font-family:inherit;color:var(--ink);background:#fff;outline:none;
  }
  .book-nums input:focus{border-color:var(--accent)}
  .add-book{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:6px;margin-top:6px}
  .add-book input{
    padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;
    font-family:inherit;color:var(--ink);background:#fff;outline:none;
  }
  .add-book input:focus{border-color:var(--accent)}
  .add-book button{
    padding:8px 14px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-weight:600;font-size:12px;
  }
  @media(max-width:600px){
    .add-book{grid-template-columns:1fr 1fr}
    .add-book button{grid-column:span 2}
  }
  .empty-note{font-size:12.5px;color:var(--muted);padding:4px 0}

  /* ================= MODAL ================= */
  #modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(61,53,80,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .modal-card{
    background:#fff;border-radius:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    padding:20px;box-shadow:0 30px 70px #3d355033;animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .modal-head h2{font-size:18px;font-weight:700}
  .icon-btn{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:.2s}
  .icon-btn:hover{background:#f5f1fb;color:var(--ink)}

  .affirmation{
    display:flex;gap:10px;align-items:flex-start;
    background:linear-gradient(135deg,#f6f0ff,#fdeef6);border-radius:14px;padding:14px;margin-bottom:18px;
  }
  .affirmation .heart{font-size:16px;line-height:1.4}
  .affirmation p{font-size:13px;line-height:1.5;font-style:italic;color:#5b4f75}

  .fld{margin-bottom:18px}
  .fld h3{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.pages-row{display:flex;align-items:center;gap:10px}
.pages-row span{font-size:18px;font-weight:700;min-width:44px;text-align:center}
.pages-row button{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:19px;font-weight:700;line-height:1;
}
  .mood-row{display:flex;gap:6px;flex-wrap:wrap}
  .mood-btn{
    flex:1;min-width:66px;padding:9px 5px;border-radius:12px;background:#faf8fd;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    border:2px solid transparent;transition:.18s;
  }
  .mood-btn span{font-size:20px;line-height:1}
  .mood-btn small{font-size:9.5px;color:var(--muted)}
  .mood-btn:hover{background:#f3eefb}
  .mood-btn.active{border-color:var(--accent);background:#f6f0ff}
  .mood-btn.active small{color:var(--ink);font-weight:600}

  .task{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 11px;border-radius:11px;background:#faf8fd;margin-bottom:6px}
  .task label{display:flex;align-items:center;gap:9px;cursor:pointer;flex:1;font-size:13px}
  .task input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .task.done span{text-decoration:line-through;color:var(--muted)}
  .task .del{color:#c9a3b4;font-size:12.5px;padding:2px 6px;border-radius:8px}
  .task .del:hover{background:#fdeef4;color:#c2567e}
  .add-row{display:flex;gap:6px;margin-top:6px}
  .add-row input{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;
    font-family:inherit;color:var(--ink);outline:none;background:#fff;
  }
  .add-row input:focus{border-color:var(--accent)}
  .add-row button{
    width:42px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-size:19px;line-height:1;
  }
  textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;resize:vertical;
    font-family:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff;line-height:1.5;
  }
  textarea:focus{border-color:var(--accent)}
</style>
</head>
<body>
  <!-- ============ СЛАЙД 1: ЗАГРУЗКА ============ -->
<div id="loader">
  <div class="ld-bg">
    <span class="ld-item" style="top:5%;left:7%;--r:-14deg;font-size:58px">📔</span>
    <span class="ld-item" style="top:3%;left:38%;--r:8deg;font-size:44px">✏️</span>
    <span class="ld-item" style="top:6%;left:70%;--r:12deg;font-size:52px">📓</span>
    <span class="ld-item" style="top:7%;right:4%;--r:-10deg;font-size:48px">🖊️</span>
    <span class="ld-item" style="top:28%;left:3%;--r:10deg;font-size:46px">📎</span>
    <span class="ld-item" style="top:26%;right:3%;--r:-8deg;font-size:44px">📌</span>
    <span class="ld-item" style="top:55%;left:4%;--r:-12deg;font-size:42px">📝</span>
    <span class="ld-item" style="top:58%;right:5%;--r:14deg;font-size:46px">🖍️</span>
    <span class="ld-item" style="bottom:18%;left:11%;--r:8deg;font-size:38px">📐</span>
    <span class="ld-item" style="bottom:16%;right:10%;--r:-6deg;font-size:40px">🎀</span>
    <span class="ld-item" style="bottom:5%;left:19%;--r:-10deg;font-size:54px">📚</span>
    <span class="ld-item" style="bottom:7%;left:47%;--r:6deg;font-size:44px">📖</span>
    <span class="ld-item" style="bottom:4%;right:22%;--r:-8deg;font-size:48px">📕</span>
    <span class="ld-item" style="bottom:8%;right:5%;--r:12deg;font-size:42px">📗</span>

  <div class="ld-center">
    <div class="loader-sub">Мой год</div>
    <div class="loader-title">Plans on 2027</div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

    <div class="loader-msg" id="loaderMsg">Загружаем вдохновение…</div>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">Plans on 2027<small>ежедневник · настроение · чтение</small></div>
  </div>

  <!-- СЛАЙД 2: ГОД -->
  <section id="yearView">
    <div class="year-head">
      <h1>2027</h1>
      <p>12 месяцев · 365 дней · выбирай месяц, чтобы открыть</p>
    </div>
    <div class="year-grid" id="yearGrid"></div>
  </section>

  <!-- СЛАЙД 3: МЕСЯЦ -->
  <section id="monthView" class="hidden">
    <div class="card month-card" id="monthCard">
      <div class="month-deco" id="monthDeco"></div>
      <div class="month-head">
        <h2><em id="monthEmoji">❄️</em><span id="monthTitle">Январь 2027</span></h2>
        <div class="nav">
          <button id="homeBtn" title="К году">🏠</button>
          <button id="prevM" title="Предыдущий">‹</button>
          <button id="nextM" title="Следующий">›</button>

        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div>

      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="section-title">📚 Трекер чтения <span id="readMonthName"></span></div>
    <div class="card" id="reading"></div>

    <div class="section-title">🎭 Настроение месяца</div>
    <div class="card" id="moodSummary"></div>
  </section>
</div>

<!-- МОДАЛКА ДНЯ -->
<div id="modal" class="hidden">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
/* ================= ДАННЫЕ ================= */
const YEAR = 2027;
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* Тематика каждого месяца: emoji + два цвета */
const THEMES = [
  { e:'❄️', c1:'#c8d8f0', c2:'#a0b8e0' }, // Январь — снежинки
  { e:'💝', c1:'#fad1e0', c2:'#f0a0c0' }, // Февраль — сердечки
  { e:'🌷', c1:'#ffd9e5', c2:'#c5e5c9' }, // Март — тюльпаны
  { e:'🌸', c1:'#fce4ec', c2:'#d8c8f0' }, // Апрель — сакура
  { e:'🌼', c1:'#e8f0c8', c2:'#c8e0a0' }, // Май — цветы
  { e:'☀️', c1:'#fff0b8', c2:'#f5d97a' }, // Июнь — солнце
  { e:'🌊', c1:'#c8e8f0', c2:'#88c8e0' }, // Июль — море
  { e:'🌾', c1:'#ffe5b8', c2:'#e8c088' }, // Август — колосья
  { e:'🍁', c1:'#ffd9b0', c2:'#f0a860' }, // Сентябрь — листопад
  { e:'🎃', c1:'#ffcf9c', c2:'#e0a060' }, // Октябрь — тыква
  { e:'🍂', c1:'#e8d0b8', c2:'#c8a888' }, // Ноябрь — осенние листья
  { e:'🎄', c1:'#c8e8d0', c2:'#88c8a0' }  // Декабрь — ёлка
];

/* Позиции декоративных элементов внутри карточки месяца */
const DECO_POS = [
  {t:8,  l:4,  r:-15, s:28},
  {t:14, l:88, r:12,  s:24},
  {t:44, l:2,  r:20,  s:22},
  {t:52, l:93, r:-18, s:26},
  {t:84, l:7,  r:10,  s:24},
  {t:78, l:90, r:-12, s:28},
  {t:4,  l:46, r:6,   s:20},
  {t:92, l:44, r:-8,  s:22},
];

const MOODS = [
  {id:'happy',    e:'😊', l:'Весёлое'},
  {id:'neutral',  e:'😐', l:'Нейтральное'},
  {id:'sad',      e:'😢', l:'Грустное'},
  {id:'angry',    e:'😠', l:'Злое'},
  {id:'offended', e:'😔', l:'Обидчивое'}
];

const AFFIRMATIONS = [
  'Я достоин(а) любви — просто потому, что я есть.',
  'Любовь начинается с меня самой и самого.',
  'Я открыт(а) любви и принимаю её с радостью.',

  'Любовь — это мой естественный язык.',

  'Я принимаю себя целиком — со светом и тенью.',

  'Я — дом для своей собственной любви.'
];

/* ================= ХРАНИЛИЩЕ ================= */
const K = 'planner2027:';
const load = (k, def) => { try { const v = JSON.parse(localStorage.getItem(K+k)); return v===null||v===undefined ? def : v; } catch(e){ return def; } };
const save = (k, v) => localStorage.setItem(K+k, JSON.stringify(v));
const pad = n => String(n).padStart(2,'0');
const dateStr = (m,d) => `${YEAR}-${pad(m+1)}-${pad(d)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);

const getDay  = ds => load('day:'+ds, {tasks:[], note:'', mood:null, pages:0});
const setDay  = (ds,v) => save('day:'+ds, v);
const getBooks = m => load('read:'+m, []);
const setBooks = (m,v) => save('read:'+m, v);

const daysInMonth = (m) => new Date(YEAR, m+1, 0).getDate();
const firstWeekday = (m) => (new Date(YEAR, m, 1).getDay() + 6) % 7; // 0 = Пн

function hasData(ds){
  const d = getDay(ds);
  return !!(d.mood || d.note.trim() || d.tasks.length);
}

/* ================= СЛАЙД 1: ЗАГРУЗКА ================= */
const loader = document.getElementById('loader');
const barFill = document.getElementById('barFill');
const barPct  = document.getElementById('barPct');
const loaderMsg = document.getElementById('loaderMsg');
const startBtn = document.getElementById('startBtn');

const msgs = ['Загружаем вдохновение…','Готовим страницы…','Раскладываем аффирмации…','Почти готово…'];
let progress = 0;
const timer = setInterval(() => {
  progress += Math.random()*11 + 4;
  if (progress >= 100) { progress = 100; clearInterval(timer); finishLoad(); }
  barFill.style.width = progress + '%';
  barPct.textContent = Math.round(progress) + '%';
  loaderMsg.textContent = msgs[Math.min(msgs.length-1, Math.floor(progress/26))];
}, 210);

function finishLoad(){
  loaderMsg.textContent = 'Готово! Твой год ждёт тебя 💗';
  startBtn.classList.add('show');
}
startBtn.addEventListener('click', () => {
  loader.style.opacity = '0';
  setTimeout(() => {
    loader.classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }, 600);
});
  /* ================= СЛАЙД 2: ГОД ================= */
const yearGrid = document.getElementById('yearGrid');

function renderYear(){
  const today = new Date();
  yearGrid.innerHTML = MONTHS.map((name, m) => {
    const t = THEMES[m];
    const n = daysInMonth(m);
    const lead = firstWeekday(m);
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="empty"></div>';
    for (let d = 1; d <= n; d++){
      const ds = dateStr(m,d);
      const isToday = today.getFullYear()===YEAR && today.getMonth()===m && today.getDate()===d;
      const wd = (lead + d - 1) % 7;
      const isWeekend = wd >= 5;
      let cls = '';
      if (isToday) cls = 'today';
      else if (hasData(ds)) cls = 'mark';
      else if (isWeekend) cls = 'weekend';
      cells += `<div class="${cls}">${d}</div>`;
    }
    const bg = `linear-gradient(155deg, ${t.c1}66 0%, ${t.c2}22 60%, rgba(255,255,255,.82) 100%)`;
    return `<button class="mini" data-month="${m}" style="background:${bg}">
      <h3>
        <span class="mn"><em>${t.e}</em>${name}</span>
        <span class="cnt">${n} дн.</span>
      </h3>
      <div class="mini-dow">
        <div>П</div><div>В</div><div>С</div><div>Ч</div><div>П</div>
        <div class="we">С</div><div class="we">В</div>
      </div>
      <div class="mini-days">${cells}</div>
    </button>`;
  }).join('');
}
yearGrid.addEventListener('click', e => {
  const btn = e.target.closest('.mini');
  if (btn) showMonth(+btn.dataset.month);
});

/* ================= СЛАЙД 3: МЕСЯЦ ================= */
const yearView = document.getElementById('yearView');
const monthView = document.getElementById('monthView');
const monthTitle = document.getElementById('monthTitle');
const monthEmoji = document.getElementById('monthEmoji');
const monthCard = document.getElementById('monthCard');
const monthDeco = document.getElementById('monthDeco');
const daysGrid = document.getElementById('daysGrid');
const readingEl = document.getElementById('reading');
const moodSummaryEl = document.getElementById('moodSummary');
const readMonthName = document.getElementById('readMonthName');

let currentMonth = 0;

function showMonth(m){
  currentMonth = (m + 12) % 12;
  yearView.classList.add('hidden');
  monthView.classList.remove('hidden');
  renderMonthGrid();
  renderReading();
  renderMoodSummary();
  window.scrollTo({top:0, behavior:'smooth'});
}

function applyMonthTheme(m){
  const t = THEMES[m];
  monthEmoji.textContent = t.e;
  monthCard.style.background = `linear-gradient(155deg, ${t.c1}55 0%, ${t.c2}22 60%, rgba(255,255,255,.82) 100%)`;
  monthDeco.innerHTML = DECO_POS.map(p =>
    `<span class="md" style="top:${p.t}%;left:${p.l}%;font-size:${p.s}px;--r:${p.r}deg">${t.e}</span>`
  ).join('');
}

function renderMonthGrid(){
  const m = currentMonth;
  const t = THEMES[m];
  monthTitle.textContent = MONTHS[m] + ' ' + YEAR;
  readMonthName.textContent = '· ' + MONTHS[m];

  const n = daysInMonth(m);
  const lead = firstWeekday(m);
  const today = new Date();

  let html = '';
  for (let i = 0; i < lead; i++) html += '<div class="day empty"></div>';
  for (let d = 1; d <= n; d++){
    const ds = dateStr(m,d);
    const data = getDay(ds);
    const mood = MOODS.find(x => x.id === data.mood);
    const open = data.tasks.filter(t => !t.done).length;
    const isToday = today.getFullYear()===YEAR && today.getMonth()===m && today.getDate()===d;
    const wd = (lead + d - 1) % 7;
    const isWeekend = wd >= 5;
    html += `<button class="day ${isWeekend?'weekend':''} ${isToday?'today':''}" data-date="${ds}">
      <span>${d}</span>
      ${mood ? `<span class="m">${mood.e}</span>` : ''}
      ${open ? `<span class="badge">${open}</span>` : ''}
    </button>`;
  }
  daysGrid.innerHTML = html;
  applyMonthTheme(m);
}

daysGrid.addEventListener('click', e => {
  const cell = e.target.closest('.day[data-date]');
  if (cell) openDay(cell.dataset.date);
});

/* ---------- ТРЕКЕР ЧТЕНИЯ ---------- */
function renderReading(){
  const m = currentMonth;
  const books = getBooks(m);
  let pages = 0;
const nDays = daysInMonth(m);
for (let d = 1; d <= nDays; d++) pages += (getDay(dateStr(m,d)).pages || 0);
  const finished = books.filter(b => b.total && (+b.read) >= (+b.total)).length;

  let html = `
    <div class="read-stats">
      <div class="chip">📖 Прочитано страниц: <b>${pages}</b></div>
      <div class="chip">✅ Книг завершено: <b>${finished}</b></div>
      <div class="chip">📚 Всего в списке: <b>${books.length}</b></div>
    </div>`;

  if (!books.length){
    html += `<p class="empty-note">Список пуст — добавь первую книгу месяца.</p>`;
  } else {
    html += books.map(b => {
      const read = +b.read || 0, total = +b.total || 0;
      const pct = total ? Math.min(100, Math.round(read/total*100)) : 0;
      return `<div class="book">
        <div class="book-top">
          <div>
            <div class="book-title">${esc(b.title)}</div>
            ${b.author ? `<div class="book-author">${esc(b.author)}</div>` : ''}
          </div>
          <button class="del" data-del="${b.id}" title="Удалить">✕</button>
        </div>
        <div class="book-mid">
          <div class="pbar"><i style="width:${pct}%"></i></div>
          <div class="book-nums">
            <input type="number" min="0" value="${read}" data-read="${b.id}"> /
            <input type="number" min="0" value="${total}" data-total="${b.id}">
            <span>стр.</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  html += `<div class="add-book">
    <input id="bTitle" placeholder="Название книги">
    <input id="bAuthor" placeholder="Автор">
    <input id="bTotal" type="number" min="0" placeholder="Стр.">
    <button id="bAdd">Добавить</button>
  </div>`;

  readingEl.innerHTML = html;
}

readingEl.addEventListener('click', e => {
  const m = currentMonth;

  const del = e.target.closest('[data-del]');
  if (del){
    setBooks(m, getBooks(m).filter(b => b.id !== del.dataset.del));
    renderReading();
    return;
  }

  if (e.target.id === 'bAdd'){
    const t = document.getElementById('bTitle').value.trim();
    if (!t) { document.getElementById('bTitle').focus(); return; }
    const books = getBooks(m);
    books.push({
      id: uid(),
      title: t,
      author: document.getElementById('bAuthor').value.trim(),
      total: +document.getElementById('bTotal').value || 0,
      read: 0
    });
    setBooks(m, books);
    renderReading();
  }
});

readingEl.addEventListener('change', e => {
  const m = currentMonth;
  const books = getBooks(m);
  const b = books.find(x => x.id === (e.target.dataset.read || e.target.dataset.total));
  if (!b) return;
  if (e.target.dataset.read !== undefined) b.read = Math.max(0, +e.target.value || 0);
  if (e.target.dataset.total !== undefined) b.total = Math.max(0, +e.target.value || 0);
  setBooks(m, books);
  renderReading();
});

/* ---------- НАСТРОЕНИЕ МЕСЯЦА ---------- */
function renderMoodSummary(){
  const m = currentMonth;
  const n = daysInMonth(m);
  const counts = {};
  MOODS.forEach(x => counts[x.id] = 0);

  for (let d = 1; d <= n; d++){
    const data = getDay(dateStr(m,d));
    if (data.mood && counts[data.mood] !== undefined) counts[data.mood]++;
  }

  moodSummaryEl.innerHTML = `<div class="read-stats" style="margin:0">
    ${MOODS.map(x => `<div class="chip">${x.e} ${x.l}: <b>${counts[x.id]}</b></div>`).join('')}
  </div>`;
}

/* ---------- НАВИГАЦИЯ ---------- */
document.getElementById('homeBtn').addEventListener('click', () => {
  monthView.classList.add('hidden');
  yearView.classList.remove('hidden');
  renderYear();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('prevM').addEventListener('click', () => showMonth(currentMonth - 1));
document.getElementById('nextM').addEventListener('click', () => showMonth(currentMonth + 1));

/* ================= МОДАЛКА ДНЯ ================= */
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
let currentDate = null;

function openDay(ds){
  currentDate = ds;
  const m = +ds.slice(5,7) - 1;
  const d = +ds.slice(8,10);
  const data = getDay(ds);
  const aff = AFFIRMATIONS[(d - 1) % AFFIRMATIONS.length];

  modalCard.innerHTML = `
    <div class="modal-head">
      <h2>${d} ${MONTHS_GEN[m]} ${YEAR}</h2>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>

    <div class="affirmation">
      <div class="heart">💗</div>
      <p>${aff}</p>
    </div>

    <div class="fld">
      <h3>Настроение</h3>
      <div class="mood-row" id="moodRow">
        ${MOODS.map(x => `<button class="mood-btn ${data.mood===x.id?'active':''}" data-mood="${x.id}">
          <span>${x.e}</span><small>${x.l}</small>
        </button>`).join('')}
      </div>
    </div>

    <div class="fld">
      <h3>Задачи</h3>
      <div id="taskList"></div>
      <div class="add-row">
        <input id="taskInput" placeholder="Новая задача…">
        <button id="addTask">+</button>
      </div>
    </div>

<div class="fld">
  <h3>Прочитано страниц</h3>
  <div class="pages-row">
    <button id="pageMinus">−</button>
    <span id="pagesVal">${data.pages || 0}</span>
    <button id="pagePlus">+</button>
  </div>
</div>

    <div class="fld" style="margin-bottom:0">
      <h3>Заметки</h3>
      <textarea id="noteInput" rows="4" placeholder="Что важного случилось сегодня?">${esc(data.note)}</textarea>
    </div>
  `;

  modal.classList.remove('hidden');
  renderTasks();
  document.getElementById('taskInput').focus();

  document.getElementById('closeModal').onclick = closeDay;

  document.getElementById('moodRow').addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn) return;
    const data = getDay(currentDate);
    data.mood = (data.mood === btn.dataset.mood) ? null : btn.dataset.mood;
    setDay(currentDate, data);
    document.querySelectorAll('#moodRow .mood-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.mood === data.mood));
    renderMonthGrid();
    renderMoodSummary();
  });
  document.getElementById('addTask').onclick = addTask;
  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });
const setPages = (delta) => {
  const data = getDay(currentDate);
  data.pages = Math.max(0, (data.pages || 0) + delta);
  setDay(currentDate, data);
  document.getElementById('pagesVal').textContent = data.pages;
  renderMonthGrid();
};
document.getElementById('pagePlus').onclick = () => {
  const v = prompt('Сколько страниц добавить?', '10');
  if (v === null) return;
  const n = Math.max(0, parseInt(v, 10) || 0);
  if (n) setPages(n);
};
document.getElementById('pageMinus').onclick = () => setPages(-1);
  const note = document.getElementById('noteInput');
  note.addEventListener('input', () => {
    const data = getDay(currentDate);
    data.note = note.value;
    setDay(currentDate, data);
    renderMonthGrid();
  });
}

function addTask(){
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;
  const data = getDay(currentDate);
  data.tasks.push({id: uid(), text, done: false});
  setDay(currentDate, data);
  input.value = '';
  input.focus();
  renderTasks();
  renderMonthGrid();
}

function renderTasks(){
  const data = getDay(currentDate);
  const el = document.getElementById('taskList');
  if (!data.tasks.length){
    el.innerHTML = `<p class="empty-note">Пока пусто — добавь первую задачу.</p>`;
    return;
  }
  el.innerHTML = data.tasks.map(t => `
    <div class="task ${t.done?'done':''}">
      <label>
        <input type="checkbox" data-toggle="${t.id}" ${t.done?'checked':''}>
        <span>${esc(t.text)}</span>
      </label>
      <button class="del" data-del="${t.id}">✕</button>
    </div>
  `).join('');
}

document.getElementById('modalCard').addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle){
    const data = getDay(currentDate);
    const t = data.tasks.find(x => x.id === toggle.dataset.toggle);
    if (t) t.done = !t.done;
    setDay(currentDate, data);
    renderTasks();
    renderMonthGrid();
    return;
  }
  const del = e.target.closest('#taskList [data-del]');
  if (del){
    const data = getDay(currentDate);
    data.tasks = data.tasks.filter(x => x.id !== del.dataset.del);
    setDay(currentDate, data);
    renderTasks();
    renderMonthGrid();
  }
});

function closeDay(){
  modal.classList.add('hidden');
  currentDate = null;
}
modal.addEventListener('click', e => { if (e.target === modal) closeDay(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeDay(); });

/* ================= СТАРТ ================= */
renderYear();
</script>
</body>
